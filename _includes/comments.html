{%- comment -%} giscus comment thread. On/off decided by flags.html (shared with the CSP in head). {%- endcomment -%}
{%- include flags.html -%}
{%- if comments_on %}
<section class="comments">
  <script src="https://giscus.app/client.js"
    data-repo="{{ site.giscus.repo }}"
    data-repo-id="{{ site.giscus.repo_id }}"
    data-category="{{ site.giscus.category }}"
    data-category-id="{{ site.giscus.category_id }}"
    data-mapping="pathname" data-strict="1"
    data-reactions-enabled="1" data-emit-metadata="0"
    data-input-position="top" data-theme="preferred_color_scheme"
    data-lang="en" data-loading="lazy"
    crossorigin="anonymous" async></script>
</section>
{%- endif %}
