- key: adversarial-learning
  title: "Adversarial Learning in the Wild"
  tagline: "Attacking and defending deployed fraud and biometric models the way real adversaries would."
  image: /assets/img/research/adversarial-learning-light-projection.png
  image_fit: contain
  image_bg: "#ffffff"
  inline_figs: true
  essay:
    - "A payment network approves or declines every transaction in about a millisecond, more than a hundred billion times a year, and the model that makes this call is the main barrier against fraud. Fraudsters adapt to it: they probe, learn what gets approved, and change their behavior. Identity is the second front. As face, voice and fingerprint replace passwords for app login and payment, which VISA offered to banks and merchants through Visa ID Intelligence, the biometric model becomes the lock on the account. A fooled fraud model is a financial loss; a fooled identity model is an account takeover. For VISA, adversarial robustness is a core risk question, not a research curiosity."
    - "Most adversarial machine learning perturbs pixels in a file. A deployed model is attacked differently: through the transactions a fraudster is able to make, or through the camera a face is presented to. The owner of such a model needs to see how it fails before an attacker does, and needs a defense that still works when the attacker knows it is there. No static defense survives unlimited tries. The practical goal is cost: every successful attack should need more knowledge, more attempts and a larger perturbation."
    - "1) Attack on the VISA fraud detection model. We built the first adversarial sandbox for VISA Research's fraud detection team (U.S. Patent 11,244,321). A reinforcement-learning agent plays a fraudster holding a compromised account. Its actions are real choices, which merchant and what amount, inside a simulated time window. Its state is the account's history, including which earlier attempts were approved or declined."
    - image: /assets/img/research/adversarial-learning-sandbox.png
      narrow: true
      caption: "One step of the sandbox: the agent picks a transaction, the fraud model scores it, and the outcome becomes the agent's reward. FIG. 3 of U.S. Patent 11,244,321."
    - "Each synthesized transaction is scored by the fraud model itself: if the model misses it, the agent earns the amount; if the model catches it, the agent earns nothing. Trained on the discounted sum of these rewards, the agent learns sequences, not single transactions, and goes to the weakest merchants first. Several agents with different goals can run together. Reading back the highest-reward sequences shows where the model is blind. Run against the VISA Deep Authorization model, which prevents $30B in fraud a year, the sandbox evaluated worst-case scenarios and found multiple blind spots."
    - "2) Attack on a physical face recognition system. Here the attacker controls what the camera sees, not the image file. The setup is a webcam and an ordinary projector, calibrated once for position and color. A pattern is optimized against one averaged image of the attacker, which makes it robust to small head movements and fast enough for real time, and is then projected onto the attacker's own face."
    - image: /assets/img/research/adversarial-learning-light-projection.png
      caption: "Light-projection attack: a camera captures the tester, a light pattern is computed from the tester and target images, and a projector casts it onto the face. FIG. 1 of U.S. Patent 11,163,985; method in Nguyen, Arora, Wu, Yang, CVPR Workshops 2020."
    - "In live tests with 50 subjects, the attack impersonated a chosen target in 23 of 25 attempts against an open-source system, and in 15 of 25 against a commercial system with no access to its internals. Evading recognition succeeded in 10 of 10 and 7 of 10."
    - "3) Defense: a hold-out dataset and graph models. Every decision is checked against data the attacker cannot see. For biometric login, this is the user's enrolled samples, extended at enrollment with learned perturbations. An impersonation built from public photos is compared with this hidden set and caught, even if the enrollment data later leaks. The latent neighborhood graph applies the same idea to any classifier. It keeps a reference set of genuine and adversarial examples, retrieves the input's neighbors from it, learns how they connect, and classifies the whole neighborhood with a graph attention network."
    - image: /assets/img/research/adversarial-learning-lng.png
      caption: "Latent neighborhood graph: the input (blue) is embedded, its genuine (black) and adversarial (red) neighbors are retrieved from a hold-out reference set, and the resulting graph is classified. Figure 1 of Abusnaina, Wu et al., ICCV 2021."
    - "It detects attacks it was never trained on, and stays above 80% against an attacker who knows the defense."
    - "4) Defense: dynamic targeted perturbation. The second defense turns the attacker's own tool around. The input is first perturbed once at random, so the attacker cannot predict the exact function being checked. Then, for the input, its perturbed copy and its nearest reference example, we compute the targeted perturbation an attacker would use: the gradient direction that pushes each one toward its most likely classes."
    - image: /assets/img/research/adversarial-learning-agd.png
      caption: "Adversarial gradient directions (v) for an adversarial input (left) and a genuine one (right): the query x, its randomly perturbed copy, and the nearest reference example. The directions agree only for the genuine input. Figure 1 of Wu et al., AAAI 2021."
    - "For a genuine input these directions agree. For an adversarial input they do not, because it sits just across a decision boundary it does not belong to. One random perturbation and one reference example reach about 98% detection AUC across five attack types. To get through, an attacker has to beat the classifier, the random check and a reference set it cannot see, all at once, with a perturbation small enough to pass. That is the larger budget."
    - "The sandbox was delivered to VISA's fraud detection team. The direction produced nine patents covering the sandbox, light-projection testing, and the biometric and neighborhood-based defenses."
  pubs:
    - "Adversarial Light Projection Attacks on Face Recognition Systems: A Feasibility Study"
    - "Beating Attackers at Their Own Games: Adversarial Example Detection Using Adversarial Gradient Directions"
    - "Adversarial Example Detection Using Latent Neighborhood Graph"
