# Research themes (Research tab + /research/<key>/ pages), in display order.
# key         page slug; research/<key>.html must exist with `research_key: <key>`
# image       optional figure taken from one of the papers (assets/img/research/); no generated art
# image_fit   contain (letterbox) | cover;  image_bg  letterbox colour
# caption     figure caption with its source
# essay       one short essay (list of paragraphs); when present it replaces background…action.
#             an item may also be a figure: {image, caption, narrow}; set inline_figs: true to drop the top figure
#             (image is then only the Research-tab thumbnail)
# background  what the client needs        objective  general problem definition
# situation   existing solutions and their limits
# task        the specific sub-problem we attack
# action      our solution, one bullet per idea
# pubs        publication titles (must match _data/publications.yml)
# patents     patent ids (must match _data/patents.yml)
# press       press item urls (must match _data/press.yml)
# dissertation optional {title, venue, year, url}
- key: node-classification
  title: "Node Classification with Constrained Labels"
  tagline: "Reliable decisions on large graphs from a handful of trusted labels."
  image: /assets/img/research/node-classification-smartquery.png
  image_fit: contain
  image_bg: "#ffffff"
  inline_figs: true
  essay:
    - "At a payment network, most risk decisions are decisions about nodes in a graph: is this merchant about to default, is this account compromised, is this employee's access abnormal. Two teams at VISA faced the same limit. The security team watches tens of thousands of employees with a handful of analysts, and each alert takes a person hours to investigate. The risk team monitors merchants by the hundred million, and a case is confirmed only after an investigation closes. In both, analyst time is the scarcest resource, so labels are few, slow and expensive, and a label-hungry model is not practical in production."
    - "The business still needs a decision for every node, and two shortcuts fail. A graph network trained on a few labels is confident about nodes it knows nothing about. And spreading labels along raw edges assumes that connected nodes share a label, which is exactly what a bad actor breaks by connecting to normal users. So the problem has three parts: which few nodes to label, which neighbors to trust, and how far a label is allowed to travel."
    - "1) Active learning: spend each label where it changes the model most. SmartQuery (the figure below) first uses what is reliable from the start, the graph structure: degree and PageRank shortlist a small pool of central candidates, once. Then, for every candidate and every label it could receive, we ask how much the uncertainty of the whole graph would drop. Retraining the network for each answer is too slow, so label propagation stands in for it. The drop is weighted by the model's current class probabilities, and the candidate with the largest expected drop goes to the expert. The structural shortlist alone improved accuracy by 16%, and the method stays competitive with only a few labels per class."
    - image: /assets/img/research/node-classification-smartquery.png
      caption: "SmartQuery: candidates are pooled once from graph structure; in each round, label propagation estimates how much labeling each candidate would reduce the model's uncertainty, and the best one is sent to the expert. Figure 1 of Li, Wu et al., SmartQuery, 2022."
    - "2) Peer grouping: decide who a node should be compared with. Peers are learned from behavior, without annotation: each entity is described by what it accesses, rare activity is weighted more than common activity, and nearest neighbors are computed every month. Only neighbors that keep a stable rank across months count as peers, and the largest gap in that ranking marks where the peer group ends. When there are several kinds of relation, each one is a graph layer. The layers are merged with learned weights, and those weights are updated from the few nodes an analyst confirms."
    - image: /assets/img/research/node-classification-peers.png
      narrow: true
      caption: "Peer consistency: an employee's nearest neighbors are ranked every month (top), and only those that stay close across months are kept as peers (bottom). FIGS. 2E and 2F of U.S. Patent 11,481,485."
    - image: /assets/img/research/node-classification-multilayer.png
      narrow: true
      caption: "Peer context from a multi-layer graph: relation layers are merged with learned weights, each node is scored against its peers, and analyst feedback refines the weights. FIG. 1 of U.S. Patent 11,711,391."
    - "3) Trusted seeds and label growing. A confirmed node is a trusted seed. Its label grows outward on the learned manifold, not along raw edges. In embedding space, new training examples are synthesized by mixing a seed anomaly with sampled nodes, with an adaptive mixing ratio, and the model is trained around an anomaly prototype and a normal prototype (GADAM). On the graph itself, ALT learns a weight for every edge and splits the graph into two complementary parts, so a label spreads across edges that agree with it and stops at edges that do not. This improved existing graph networks by 7 to 15% where connected nodes tend to differ, without hurting them where connected nodes agree."
    - image: /assets/img/research/node-classification-alt.png
      caption: "ALT: an augmenter learns a weight for every edge and splits the graph into two complementary graphs; two networks read them and their signals are combined. Figure 2 of Xu, Chen, Zhou, Wu et al., KDD 2023."
  pubs:
    - "SmartQuery: An Active Learning Framework for Graph Neural Networks through Hybrid Uncertainty Reduction"
    - "Node Classification Beyond Homophily: Towards a General Solution"
    - "Graph Anomaly Detection with Adaptive Node Mixup"
    - "Rethinking Personalized Federated Learning with Clustering-Based Dynamic Graph Propagation"
