- key: anomaly-detection
  title: "Anomaly Detection on Terabytes of Financial Data"
  tagline: "From raw streams to anomaly-event snippets, then to classification."
  image: /assets/img/research/anomaly-detection-event2graph.png
  image_fit: contain
  image_bg: "#ffffff"
  inline_figs: true
  essay:
    - "A payment network produces terabytes of transaction and activity logs. Anomalies are rare, and what counts as normal keeps moving. Scoring every raw point against one global model does not hold up at this scale: the same spike is routine for one merchant and alarming for another, and a system-wide shift looks like a million anomalies at once. Three things shape the method: the scale, the variety of anomalies, and the assumption that every series depends on every other."
    - "1) Scale forces a trade-off. A detector that is accurate on one series but expensive per entity cannot watch 150M merchants, and comparing every entity with every other does not scale either. So we give up one global model and score each entity only against its peers. The peer graph is built to stay sparse: an edge exists only between entities that share static attributes, and its weight is the distance between their recent time series. Each entity then gets a small peer group. When its behavior changes, we check the peers first. If their risk scores moved together, the change is a systematic shift and the alert is dropped; if only this entity moved, it is a true anomaly, caught early. The multi-layer peer technique from our node classification work is reused here (the figure below): several relation layers are merged into one peer graph with learned weights, and analyst feedback refines them."
    - image: /assets/img/research/node-classification-multilayer.png
      narrow: true
      caption: "Peer context from a multi-layer graph: relation layers are merged with learned weights, each node is scored against its peers, and analyst feedback refines the weights. FIG. 1 of U.S. Patent 11,711,391."
    - "2) Anomalies come in many kinds, and no single detector catches them all. A change in frequency, a change in correlation, an abrupt value change and a slow drift leave different traces. A method that is good at one is weak at another, so the choice of method has to be made per case, automatically."
    - "We do this in two steps. First we synthesize the data (the figure below). A base signal is built in the frequency domain, noise is added in both frequency and time so it looks real, and labeled outliers of five types are inserted: global point, contextual point, shapelet, seasonal and trend. Because we generate them, we know exactly where each one is and what type it is. Then a meta-learner is trained on this data. It reads a query segment next to a clean baseline, decides which outlier types are present, and ranks the detectors for each type, so the right method is selected without a person in the loop. FMUAD follows the same reasoning inside one model, with separate modules for value, frequency and correlation changes; it improved F1 by 17% on average over earlier forecast-based detectors."
    - image: /assets/img/research/anomaly-detection-synthesis.png
      caption: "Synthesized training data: 2,000 base signals, expanded into clean segments and segments with one or two types of labeled anomalies, with six generated examples. FIG. 9 of U.S. Patent Application 2024/0412098."
    - "3) Breaking the dependency assumption. Recurrent forecasters assume that every series depends on every other series, and that this dependency never changes. In real systems the dependencies are partial and they shift. Event2Graph (the figure below) drops the assumption. It cuts each series into short windows, finds the patterns that repeat, and merges similar patterns across series into a shared set of events. Series and events become the two node types of a dynamic bipartite graph; an edge says that this event happened on this series at this time, so two series are related only while they share events."
    - image: /assets/img/research/anomaly-detection-event2graph.png
      caption: "Event2Graph: recurring short patterns (events I–IV) and the series they occur on (1–3) form a bipartite graph. At normal times the predicted links (green, dashed) match the observed ones (red); at t90 they do not, and the mismatch is the anomaly. Figure 1 of Wu et al., Event2Graph, 2022."
    - "Where, when and which are stored separately, so the graph grows linearly with the number of series, not exponentially. A temporal graph network with per-node memory is trained, without labels, to predict the next edges. The predicted event is then projected back into the original signal and compared with what actually arrived. The mismatch is the anomaly score, and it comes with a readable reason: which series, which expected pattern, what showed up instead."
    - "When the data cannot leave its owner, the model goes to the data. With federated learning and secure multi-party computation, a payment network and its banks train one detector without any bank revealing its private account flags. Precision-recall improved from 0.6 to 0.7, and the entry received a special recognition prize in the US–UK privacy-enhancing technologies challenge."
    - "The work shipped. At VISA it led to a merchant credit risk model that continuously monitors 150M merchants worldwide, and to an insider-risk model covering 20K+ employees that raised the detection rate by 300%."
  pubs:
    - "Event2Graph: Event-driven Bipartite Graph for Multivariate Time Series Forecasting and Anomaly Detection"
    - "Forecast-based Multi-aspect Framework for Multivariate Time-series Anomaly Detection"
    - "Semi-supervised Context Discovery for Peer-Based Anomaly Detection in Multi-layer Networks"
    - "Privacy-Preserving Financial Anomaly Detection via Federated Learning & Multi-Party Computation"
