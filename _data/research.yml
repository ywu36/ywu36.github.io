- key: face-recognition
  title: "Unconstrained Face Recognition in the Wild"
  tagline: "Learning an identity space that holds across pose, light and occlusion, from detection to recognition."
  image: /assets/img/research/face-recognition-godp.png
  image_fit: contain
  image_bg: "#ffffff"
  inline_figs: true
  essay:
    - "Before 2018, most face recognition was built for cooperative, near-frontal faces, and there it looked solved. Turn the head 90° or change the light, and accuracy fell apart. The trouble is in the embedding: two samples of the same person at different poses sit farther apart than two different people at the same pose. The nuisance factor outweighs the signal. The same structure appears in many representation problems, where a small change in the input can flip the label while very different inputs can share one. The representation has to be organized by the label, not by the raw input."
    - "We spent five years, 2013 to 2018, on every stage that feeds that space: detection, 3D reconstruction, alignment, and the recognition template. Along the way we learned that the two obvious shortcuts don't work. Regressing coordinates or pose straight from the input is too coarse and falls over under occlusion. Asking one embedding to be invariant to everything at once is more than the data can support."
    - "So we built supervised attention, the first in biometrics, before the Transformer made attention mainstream. The idea is simple: show the network where to look, and supervise that \"where\" directly instead of hoping it emerges."
    - "1) Face alignment. GoDP (the figure below) predicts a confidence map for each landmark, trained against the true pixel location. Shallow layers propose candidates, deep layers clean them up, and a distance-aware loss punishes false alarms near the target. Those supervised maps then act as attention at every stage. Better alignment meant a cleaner, pose-normalized face, and rank-1 identification went up 44%."
    - image: /assets/img/research/face-recognition-godp.png
      caption: "Supervised attention in GoDP: shallow layers propose landmark candidates, deep layers refine them; the confidence maps (bottom) show background false alarms (red circles) suppressed stage by stage. Figure 2.3 of Y. Wu, Ph.D. dissertation, University of Houston, 2018."
    - "2) Occlusion-aware guided attention. When the head turns, part of the face simply isn't there. A fitted 3D model tells us which regions are hidden, and that mask guides the aggregation (OGCTL / MGCTL): every visible patch casts a vote for who this is, and hidden patches stay quiet. The embedding got more than 10x smaller at the same accuracy, fast enough to match over a million templates per second on one CPU core."
    - image: /assets/img/research/face-recognition-mgctl.png
      narrow: true
      caption: "Mask-guided template learning: an occlusion mask (m) gates each local face representation, so only visible patches contribute to the template t. Figure 4.6 of Y. Wu, Ph.D. dissertation, University of Houston, 2018."
    - "The work did not stop at papers. We took it from research to product: a full-stack 3D face recognition system, delivered to the U.S. Department of Homeland Security."
