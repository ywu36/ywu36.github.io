- title: "Node Classification Beyond Homophily: Towards a General Solution"
  authors: "Z. Xu, Y. Chen, Q. Zhou, Y. Wu*, M. Pan, H. Yang, H. Tong"
  summary: "GNNs assume connected nodes share labels and break on heterophilic graphs, and most fixes only work for one model. ALT splits the graph into two components, extracts complementary signals from each and combines them adaptively, improving node classification across many GNN backbones on both homophilic and heterophilic graphs."
  venue: "KDD"
  year: 2023
  url: "https://doi.org/10.1145/3580305.3599446"
  exp: visa
- title: "Event2Graph: Event-driven Bipartite Graph for Multivariate Time Series Forecasting and Anomaly Detection"
  authors: "Y. Wu*, M. Gu, L. Wang, Y. Lin, F. Wang, H. Yang"
  summary: "RNN-based multivariate time-series models assume a fixed, fully connected dependency between series. Event2Graph links series to recurring short patterns (\"events\") in a dynamic bipartite graph, turning forecasting and anomaly detection into self-supervised prediction of the graph's edge stream."
