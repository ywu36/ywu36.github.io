- title: "Graph Anomaly Detection with Adaptive Node Mixup"
  authors: "Q. Zhou, Y. Chen, Z. Xu, Y. Wu*, M. Pan, M. Das, H. Yang, H. Tong"
  summary: "Labeled anomalies are scarce, so graph anomaly detectors get little supervision. GADAM augments training data with an adaptive mixup of node embeddings, adds efficient negative sampling and prototype-based representation learning, and beats prior methods across several metrics."
